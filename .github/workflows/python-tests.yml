name: Python checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: |
          python -m unittest discover -s 01-ai-response-quality-evaluator/tests
          python -m unittest discover -s 02-dataset-quality-audit/tests
